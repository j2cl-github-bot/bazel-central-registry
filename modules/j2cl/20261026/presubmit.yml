matrix:
  platform:
    - macos
    - ubuntu2004
  bazel:
    - 8.x
tasks:
  run_tests:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    # protobuf >= 32 (pulled in by rules_java 8.16.1) declares a lock file for the default `maven`
    # repository. Unless the root module declares its own maven.install(), rules_jvm_external uses
    # that lock file for the whole `maven` repo and drops the artifacts requested by elemental2 and
    # its dependencies. Declare an empty maven.install() in the anonymous root module, as a typical
    # consumer would.
    shell_commands:
      - "echo 'bazel_dep(name = \"rules_jvm_external\", version = \"6.6\")' >> MODULE.bazel"
      - "echo 'maven = use_extension(\"@rules_jvm_external//:extensions.bzl\", \"maven\")' >> MODULE.bazel"
      - "echo 'maven.install()' >> MODULE.bazel"
    build_flags:
      - "--java_language_version=21"
      - "--java_runtime_version=21"
      - "--tool_java_language_version=21"
      - "--tool_java_runtime_version=21"
    build_targets:
      - '@elemental2//:all'
